<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WeatherSphere | Your Daily Weather Companion</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="weather-app">
        <div class="weather-card">
                        <div class="app-header">
                <h1>
                    <span class="weather-icon">🌤️</span>
                    WeatherSphere
                </h1>
                <p class="tagline">Your daily weather companion</p>
            </div>
        
            <div class="search-area">
                <div class="search-row city-search">
                    <input type="text" id="cityName" placeholder="Enter city name, e.g., London, Tokyo, New York" autocomplete="off">
                    <button id="searchCityBtn" class="btn-primary">
                        <span>🔍</span> Get Weather
                    </button>
                </div>
                
            
                <div class="search-row coord-search">
                    <input type="text" id="latitude" placeholder="Latitude (e.g., 40.7128)">
                    <input type="text" id="longitude" placeholder="Longitude (e.g., -74.0060)">
                    <button id="searchCoordBtn" class="btn-secondary">
                        <span>📍</span> Find by Location
                    </button>
                </div>
                
             
                <div class="search-row favorite-action">
                    <button id="addFavoriteBtn" class="btn-favorite">
                        <span>⭐</span> Add Current City to Favorites
                    </button>
                </div>
            </div>
            
            <div class="favorites-panel">
                <div class="panel-header">
                    <h3>📌 Your Favorite Cities</h3>
                    <span class="favorite-hint">(Click any to check weather)</span>
                </div>
                <ul id="favoritesList" class="favorites-list">
                    <li class="empty-message">No favorites yet. Add a city above!</li>
                </ul>
            </div>
            
            <div class="weather-display">
                <h2 id="weatherTitle">Weather Information</h2>
                <div class="weather-details">
                    <p id="cityDisplay" class="city-name">--</p>
                    <p id="tempDisplay" class="temperature">--</p>
                    <p id="descDisplay" class="description">--</p>
                    <p id="coordDisplay" class="coordinates">📍 --</p>
                </div>
            </div>
            
            <div id="forecastSection" class="forecast-section" style="display: none;">
                <h3>📅 3-Day Weather Forecast</h3>
                <div class="forecast-grid" id="forecastGrid">
                    <div class="forecast-card">
                        <div class="forecast-date">--</div>
                        <div class="forecast-icon">
                            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="weather icon">
                        </div>
                        <div class="forecast-temp">--</div>
                        <div class="forecast-desc">--</div>
                    </div>
                    <div class="forecast-card">
                        <div class="forecast-date">--</div>
                        <div class="forecast-icon">
                            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="weather icon">
                        </div>
                        <div class="forecast-temp">--</div>
                        <div class="forecast-desc">--</div>
                    </div>
                    <div class="forecast-card">
                        <div class="forecast-date">--</div>
                        <div class="forecast-icon">
                            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="weather icon">
                        </div>
                        <div class="forecast-temp">--</div>
                        <div class="forecast-desc">--</div>
                    </div>
                </div>
                
                
                <div class="toggle-wrapper">
                    <button id="toggleTempBtn" class="btn-toggle">
                        🌡️ Switch to Fahrenheit
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="weather.js"></script>
</body>
</html>
